name: Dependabot nixpkgs diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  nixpkgs-diff:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate nixpkgs diff markdown
        run: |
          cp head/.github/nix-watchlist.txt .github-nix-watchlist.txt
          WATCHLIST_FILE=.github-nix-watchlist.txt \
            bash head/workflow/scripts/dependabot-nix-diff.sh "$PWD/base" "$PWD/head" > diff.md

      - name: Upsert PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nixpkgs-diff
          path: diff.md
